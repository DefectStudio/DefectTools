[FilterPlugin]
; UAT already includes descriptor, content, source, resources, generated headers,
; and every manifest-declared build product (including runtime .obj/.precompiled).
; Include configuration explicitly so package redirects/settings travel with it.
/Config/...
/Docs/...
/Scripts/...
; Python may have been imported in the development checkout; caches are not assets.
-.../__pycache__/...
-.../.pytest_cache/...
-.../*.pyc
